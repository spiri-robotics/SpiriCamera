name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install project
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install project
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov=SpiriCamera
  test-docker:
    # The image's own test run, to catch differences from the runner's environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests in the image
        run: docker compose -f docker/compose.test.yaml run --rm test
