# camera-ingress: captures from a source and publishes frames onto
# SpiriSynq, continuously, until stopped.
#
# Defaults to the bundled synthetic test pattern so it runs with no
# hardware attached -- useful for trying the app store entry itself.
# For a real camera, set SOURCE (e.g. SOURCE=/dev/video0 or
# SOURCE=rtsp://user:pass@host/stream) and, for a local device, add a
# devices: mapping for it.
services:
  camera-ingress:
    image: ghcr.io/spiri-robotics/spiricamera:latest
    restart: unless-stopped
    command: ["SpiriCamera", "run"]
    # On `spirisynq`, not host: the zenoh-router app on that network lets
    # peers reach each other without LAN multicast. Install zenoh-router
    # first.
    networks:
      - spirisynq
    # RTSP: /raw, /hud and /preview for QGroundControl, and /<camera>/relay
    # for MediaMTX.
    ports:
      - "8554:8554/tcp"
      - "8000-8003:8000-8003/udp"
    environment:
      - SPIRICAMERA_SOURCE=${SOURCE:-testimage://pm5544}
      # Published as cameras/<name>/raw, hud and preview. Give a second
      # camera on this robot another name.
      - SPIRICAMERA_CAMERA_NAME=${CAMERA_NAME:-1}
      # The widgets drawn on cameras/<name>/hud, by topic, separated by spaces.
      # ./ is this host's: ./hud/widgets/horizon is spirimav's horizon.
      - SPIRICAMERA_HUD_WIDGETS=${HUD_WIDGETS:-}
      # What the camera is mounted on, by topic, so it has a pose: spirimav's
      # gimbal is ./robot_gimbal1. Empty leaves it unplaced.
      - SPIRICAMERA_RELATIVE_TO=${RELATIVE_TO:-}
      - SPIRICAMERA_QUALITY=${QUALITY:-80}
      - SPIRICAMERA_FRAME_WIDTH=${FRAME_WIDTH:-1920}
      - SPIRICAMERA_FRAME_HEIGHT=${FRAME_HEIGHT:-1080}
      - SPIRICAMERA_FRAMERATE=${FRAMERATE:-30}
      # The most bytes in one slice of the H.264 encode, so each fits one RTP
      # packet and a lost packet costs a strip of a frame; 0 for no limit.
      - SPIRICAMERA_H264_SLICE_MAX_SIZE=${H264_SLICE_MAX_SIZE:-1100}
      # The lens, if known (0 is unset): a field of view in degrees from
      # the datasheet, or a calibration, OpenCV's camera matrix at the
      # image size it was made at. Outranks what the source or MAVLink says.
      - SPIRICAMERA_HFOV=${HFOV:-0}
      - SPIRICAMERA_VFOV=${VFOV:-0}
      - SPIRICAMERA_FX=${FX:-0}
      - SPIRICAMERA_FY=${FY:-0}
      - SPIRICAMERA_CX=${CX:-0}
      - SPIRICAMERA_CY=${CY:-0}
      - SPIRICAMERA_CALIBRATION_WIDTH=${CALIBRATION_WIDTH:-0}
      - SPIRICAMERA_CALIBRATION_HEIGHT=${CALIBRATION_HEIGHT:-0}
    # devices:
    #   - ${SOURCE}:${SOURCE}

networks:
  spirisynq:
    name: spirisynq
    external: true
